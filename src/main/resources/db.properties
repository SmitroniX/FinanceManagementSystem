# ============================================================================
# FinVantage Database Configuration
# Supported: Oracle Database 12c, 19c, 21c, 23c, Oracle XE, Oracle Free
# ============================================================================

# Connection Mode: ORACLE (set to MOCK for offline demo if Oracle server is unavailable)
db.mode=ORACLE

# Oracle JDBC Driver
db.driver=oracle.jdbc.OracleDriver

# Oracle Connection URL formats:
# Thin SID:        jdbc:oracle:thin:@localhost:1521:xe
# Thin Service:    jdbc:oracle:thin:@//localhost:1521/XEPDB1
# Thin TNS/Cloud:  jdbc:oracle:thin:@localhost:1521/FREEPDB1
db.url=jdbc:oracle:thin:@localhost:1521:xe

# Credentials
db.user=system
db.password=oracle

# Connection Pool / Timeout Settings
db.timeout.seconds=5
db.pool.max.active=10
